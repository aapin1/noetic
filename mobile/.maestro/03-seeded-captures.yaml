# The seeded map must actually reach the screen. This is the end-to-end proof
# that the device, the backend, and the database line up — a passing API test
# says nothing about whether the app renders what the API returned.
appId: app.mneme.mobile
---
# The deep link both launches the app and forces the bundle to load from
# Metro (the dev client only auto-connects if it remembers a server). Retried
# because a link opened mid-launch can bounce to the home screen.
- retry:
    maxRetries: 2
    commands:
      - openLink: "exp+mneme://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
      # One of the three post-launch states: dev-client onboarding sheet,
      # welcome screen, or the tab bar.
      - extendedWaitUntil:
          visible:
            text: "Continue|Get started|atlas"
          timeout: 45000
# "Continue" finishes the dev-menu onboarding but leaves the dev menu open,
# so close it too.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Get started"
    file: subflows/sign-in.yaml

- extendedWaitUntil:
    visible:
      text: "archive"
    timeout: 45000
- tapOn: "archive"

- extendedWaitUntil:
    visible:
      text: ".*Dichotomy of Control.*"
    timeout: 30000
- takeScreenshot: screenshots/03-archive-list

# Search exercises the ranked listCaptures path end to end. The e2e backend
# has no LLM keys, so this also proves the semantic layer degrades cleanly:
# a text match must come back exactly as before.
- tapOn: "Search your captures"
- inputText: "bat"
- extendedWaitUntil:
    visible:
      text: ".*What Is It Like to Be a Bat.*"
    timeout: 20000
- assertNotVisible: ".*Dichotomy of Control.*"
- takeScreenshot: screenshots/03-archive-search
# Erase the query in place rather than tapping the clear button: the dev
# client's floating gear hovers near it and can eat the tap (opening the
# dev menu over the app — same trap as the Settings gear in 06).
- eraseText: 3
- extendedWaitUntil:
    visible:
      text: ".*Dichotomy of Control.*"
    timeout: 20000

# In dev builds Google's test-ad validator popover can rise over the list as
# the inline ad loads and swallow the row tap — dismiss it if present, tap,
# and retry the pair if the tap still didn't land.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: "Dismiss"
          commands:
            - tapOn: "Dismiss"
      - tapOn: ".*Dichotomy of Control.*"
      - extendedWaitUntil:
          visible:
            text: "Dismiss|.*up to you.*"
          timeout: 15000
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible:
      text: ".*up to you.*"
    timeout: 30000
- takeScreenshot: screenshots/03-capture-detail
