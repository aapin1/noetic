# The /today ritual against seeded history. The seeded position challenge is
# the lead (the collision takeover); holding it in place clears it and the
# fresh strong CONTRADICTS edge takes the slot, with the deterministic
# 30-day anniversary pick and its edge pair rendering underneath. The seeded
# 2-day streak renders the StreakMark — the real entry point.
appId: app.mneme.mobile
---
# Relaunch first: a previous flow (especially a failed one) can leave the app
# on any screen, and the deep link alone would meet it there.
- launchApp:
    stopApp: true
- retry:
    maxRetries: 2
    commands:
      - openLink: "exp+mneme://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
      - extendedWaitUntil:
          visible:
            text: "Continue|Get started|atlas"
          timeout: 45000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Get started"
    file: subflows/sign-in.yaml

- extendedWaitUntil:
    visible:
      text: "atlas"
    timeout: 45000

# A cold relaunch can open the dev client's own menu over the app — close it
# before touching anything (its sheet swallows every tap underneath).
- runFlow:
    when:
      visible: "Fast refresh"
    commands:
      - tapOn: "Close"

# Prefer the real entry point (the streak mark); fall back to the app scheme
# if the mark hasn't rendered (e.g. the streak query is still in flight).
- runFlow:
    when:
      visible: ".*day streak.*"
    commands:
      - tapOn: ".*day streak.*"
- runFlow:
    when:
      notVisible: "your position, challenged"
    commands:
      - openLink: "mneme://today"

# The seeded unacknowledged challenge leads the surface.
- extendedWaitUntil:
    visible:
      text: "your position, challenged"
    timeout: 30000
- assertVisible: ".*Every act should be examined.*"
- assertVisible: "revise position →"
- takeScreenshot: screenshots/04-today-challenge

# Hold the position in place: the challenge clears, and the fresh strong
# CONTRADICTS edge takes over the slot instead.
- tapOn: "hold position"
- extendedWaitUntil:
    visible:
      text: "two saves disagree"
    timeout: 30000
- takeScreenshot: screenshots/04-today-collision

# The ritual still runs underneath the takeover.
- scrollUntilVisible:
    element:
      text: "a month ago today, you saved this. does it still hold?"
    direction: DOWN
- assertVisible: "Memory Is Reconstructive"
- scrollUntilVisible:
    element:
      text: "these two touch"
    direction: DOWN
- assertVisible: "The Extended Mind"
- scrollUntilVisible:
    element:
      text: ".*opening this counted.*"
    direction: DOWN
- takeScreenshot: screenshots/04-today

- scrollUntilVisible:
    element:
      text: "open insight →"
    direction: UP
- tapOn: "open insight →"
- extendedWaitUntil:
    visible:
      text: "Dismiss|.*rebuilds.*"
    timeout: 30000
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible:
      text: ".*rebuilds.*"
    timeout: 30000
- takeScreenshot: screenshots/04-today-insight
