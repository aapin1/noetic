    - link "Join the waitlist" [ref=f5e4] [cursor=pointer]:
      - /url: index.html#waitlist
  - main [ref=f5e5]:
    - heading "Privacy Policy" [level=1] [ref=f5e6]
    - paragraph [ref=f5e7]: effective july 28, 2026
    - paragraph [ref=f5e8]: "Mneme is a personal thinking tool: you save things you read, watch, and think about, and the app builds a map of your ideas. That only works if you trust us with what you save, so this policy is written to be read."
    - paragraph [ref=f5e9]:
      - text: Mneme is operated by [legal entity or full name], the data controller for the purposes of this policy. You can reach us at
      - link "hello@mneme.app" [ref=f5e10] [cursor=pointer]:
        - /url: mailto:hello@mneme.app
      - text: .
    - heading "What we collect" [level=2] [ref=f5e11]
    - list [ref=f5e12]:
      - listitem [ref=f5e13]:
        - strong [ref=f5e14]: "Waitlist:"
        - text: your name and email address, used only to tell you when Mneme is available and to send occasional launch updates. You can ask to be removed at any time.
      - listitem [ref=f5e15]:
        - strong [ref=f5e16]: "Account:"
        - text: your email address, display name and handle (optional), and sign-in credentials.
      - listitem [ref=f5e17]:
        - strong [ref=f5e18]: "Your content:"
        - text: the links, articles, videos, PDFs, voice notes, and thoughts you save, plus the summaries, topics, and connections Mneme derives from them.
      - listitem [ref=f5e19]:
        - strong [ref=f5e20]: "Usage and diagnostics:"
        - text: basic technical data (device type, app version, crash reports) used to keep the app working.
    - heading "How your content is processed" [level=2] [ref=f5e21]
    - paragraph [ref=f5e22]:
      - text: When you save something, Mneme sends the relevant text to
      - strong [ref=f5e23]: OpenAI
      - text: (our AI provider) to summarize it, classify it, and relate it to your other saves. This happens with your consent, which you give during onboarding and can withdraw at any time in Settings. Under our agreement with OpenAI, your content is not used to train their models. We do not sell your content or your personal data to anyone, ever.
    - heading "Ads" [level=2] [ref=f5e24]
    - paragraph [ref=f5e25]:
      - text: The free tier of Mneme shows ads served by
      - strong [ref=f5e26]: Google AdMob
      - text: . On iOS, Mneme will only use your device's advertising identifier if you allow it through Apple's App Tracking Transparency prompt. If you decline, you still get ads, just not personalized ones. Mneme Plus removes ads entirely. Google's own privacy practices are described in the
      - link "Google Privacy Policy" [ref=f5e27] [cursor=pointer]:
        - /url: https://policies.google.com/privacy
      - text: .
    - heading "Subscriptions" [level=2] [ref=f5e28]
    - paragraph [ref=f5e29]:
      - text: Mneme Plus is billed through Apple. We never see your payment details.
      - strong [ref=f5e30]: RevenueCat
      - text: processes purchase receipts on our behalf so your subscription works across devices; it receives an anonymous user identifier and receipt data, nothing more.
    - heading "Retention and deletion" [level=2] [ref=f5e31]
    - paragraph [ref=f5e32]: We keep your data for as long as you have an account. You can delete your account and all associated data from inside the app (Settings, then Delete account), or by emailing us. Deletion is complete and permanent within 30 days. Waitlist emails are deleted when you unsubscribe or within 90 days of launch.
    - heading "Your rights" [level=2] [ref=f5e33]
    - paragraph [ref=f5e34]: Wherever you live, you can ask us what we hold about you, ask us to correct it, export it, or delete it, and you can withdraw any consent you have given. If you are in the EU or UK, these are your GDPR rights, and you may also complain to your local supervisory authority. If you are in California, you have equivalent rights under the CCPA, and we do not sell or share your personal information as those terms are defined there.
    - heading "Children" [level=2] [ref=f5e35]
    - paragraph [ref=f5e36]: Mneme is not directed at children under 13, and we do not knowingly collect their data.
    - heading "Changes" [level=2] [ref=f5e37]
    - paragraph [ref=f5e38]: If this policy changes in a way that matters, we will tell you in the app or by email before the change takes effect.
    - heading "Contact" [level=2] [ref=f5e39]
    - paragraph [ref=f5e40]:
      - link "hello@mneme.app" [ref=f5e41] [cursor=pointer]:
        - /url: mailto:hello@mneme.app
      - text: "[postal address, required for marketing email under CAN-SPAM]"
